name: Python tests

on:
  push:
  pull_request:
    branches: [v2-main]

jobs:
  tests:
    name: tests (${{ matrix.python-version }}${{ matrix.container && ', AlmaLinux 9' || '' }})
    runs-on: ubuntu-latest
    # Empty for the Ubuntu entries: those run directly on the runner
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # 3.9 is the RHEL 9 system python used at JLab. AlmaLinux 9 gives the real
          # platform (python 3.9, SQLite 3.34, pip 21.3); setup-python has no 3.9 for new Ubuntu.
          - python-version: "3.9"
            container: almalinux:9

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ !matrix.container }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up the system Python in a virtual environment
        if: ${{ matrix.container }}
        run: |
          dnf -y install python3
          python3 -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"

      # The web extra (Flask) is needed by the web GUI unit tests, the api extra (FastAPI) by unit_test_api, the dev
      # extra (PyYAML, httpx, jsonschema) by unit_test_metadata_files and unit_test_api
      - name: Install ccdb
        run: pip install ".[web,api,dev]"

      - name: Run unit tests
        working-directory: python
        run: >
          python -m unittest
          tests.unit_test_authentication
          tests.unit_test_cli_context
          tests.unit_test_cli_gui
          tests.unit_test_connection_secrets
          tests.unit_test_dump_comments
          tests.unit_test_exceptions
          tests.unit_test_path_utils
          tests.unit_test_time_parse
          tests.unit_test_time_upgrade
          tests.unit_test_time_resolution
          tests.unit_test_snapshot
          tests.unit_test_api
          tests.unit_test_utility_argument_parse
          tests.unit_test_version
          tests.unit_test_provider_attach
          tests.unit_test_provider_disconnect
          tests.unit_test_provider_lookups
          tests.unit_test_webgui
          tests.unit_test_webgui_assignments
          tests.unit_test_webgui_escaping
          tests.unit_test_webgui_fragments
          tests.unit_test_webgui_prefix
          tests.unit_test_webgui_queries
          tests.unit_test_webgui_compare
          tests.unit_test_webgui_diff
          tests.unit_test_schema_v6
          tests.unit_test_version_v6
          tests.unit_test_model_v6
          tests.unit_test_provider_shared_sets
          tests.unit_test_upgrade_v6
          tests.unit_test_dedup
          tests.unit_test_rehash
          tests.unit_test_fixture_v6
          tests.unit_test_tags
          tests.unit_test_deprecation
          tests.unit_test_properties
          tests.unit_test_units
          tests.unit_test_metadata_files

      # SQLite integration tests create their own database
      # (via ccdb.testing.recreate_test_sqlite_db) - no fixture files needed
      - name: Run SQLite integration tests
        working-directory: python
        run: >
          python -m unittest
          tests.integ_test_provider_sqlite
          tests.integ_test_cli_manager

      # A fresh schema 6 file and a schema 5 file upgraded by `ccdb db upgrade` must have the same
      # structure; on AlmaLinux 9 this checks the upgrade's table rebuilds on SQLite 3.34.
      # The schema 5 base is the frozen copy of CCDB 2.4's schema the upgrade tests use.
      # Both link-table names are left out: schema 6 keeps whichever one a database has.
      # $RUNNER_TEMP, not the runner.temp context: in the container that context is the host path.
      - name: Schema equality (fresh schema 6 against upgraded schema 5)
        run: |
          FRESH="sqlite:///$RUNNER_TEMP/schema_fresh.sqlite"
          UPGRADED="sqlite:///$RUNNER_TEMP/schema_upgraded.sqlite"
          ccdb -c "$FRESH" db init --init-i-am-sure
          python - "$UPGRADED" <<'EOF'
          import sys
          sys.path[:0] = ["python/tests", "scripts/schema"]
          from compare import engine_for
          from schema_v5_base import create_v5_sqlite
          create_v5_sqlite(engine_for(sys.argv[1]))
          EOF
          ccdb -c "$UPGRADED" db upgrade --upgrade-i-am-sure --sqlite-time-zone UTC
          python scripts/schema/compare.py diff "$FRESH" "$UPGRADED" --ignore-table variationsToTags --ignore-table variations_has_tags

      # Builds its own small SQLite databases in a temporary directory
      - name: Run shallow copy script tests
        run: python -m unittest discover -s scripts/shallow_copy

      - name: CLI entry point smoke
        run: |
          ccdb --version
          ccdb help
