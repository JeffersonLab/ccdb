name: CLI smoke test

on:
  push:
  pull_request:
    branches: [v2-main]

jobs:
  cli-smoke:
    runs-on: ubuntu-latest
    env:
      CCDB_CONNECTION: "sqlite:///${{ github.workspace }}/cli_smoke.sqlite"
      CCDB_USER: test_user
      # A schema 5 file as CCDB 2.4 makes it, for the upgrade, dedup, rehash and rollback steps
      V5_FILE: "${{ github.workspace }}/cli_smoke_v5.sqlite"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ccdb
        run: pip install .

      - name: ccdb --version
        run: ccdb --version

      - name: ccdb help
        run: ccdb help

      - name: Fails cleanly without a usable connection
        run: |
          set +e
          output=$(env -u CCDB_CONNECTION ccdb ls 2>&1)
          code=$?
          set -e
          echo "$output"
          test $code -ne 0 || { echo "expected non-zero exit code"; exit 1; }
          if echo "$output" | grep -q "Traceback"; then
            echo "CLI leaked a python traceback on a connection error"
            exit 1
          fi

      # The single canonical way to create a ccdb SQLite database -
      # no checked-in binary fixture to drift out of sync
      - name: Create database (ccdb db init)
        run: ccdb db init --init-i-am-sure

      - name: ccdb db (info)
        run: ccdb db

      - name: ccdb ls
        run: |
          ccdb ls
          ccdb ls /test/test_vars

      - name: ccdb info
        run: ccdb info /test/test_vars/test_table

      - name: ccdb cat
        run: ccdb cat /test/test_vars/test_table

      # The default-variation assignment for run 0 is constant set 4 (values 2.2 ... 2.7).
      # No `grep -q`: it closes the pipe early, and with pipefail the resulting
      # BrokenPipeError in ccdb would fail the step.
      - name: ccdb dump
        run: |
          ccdb dump /test/test_vars/test_table
          ccdb dump /test/test_vars/test_table | grep "2.2" > /dev/null

      - name: ccdb vers
        run: ccdb vers /test/test_vars/test_table

      - name: ccdb mkdir
        run: ccdb mkdir /test/smoke_dir

      - name: ccdb mktbl + add + vers
        run: |
          ccdb mktbl /test/smoke_dir/data_table -r 2 x y z
          ccdb add /test/smoke_dir/data_table -r 0- python/tests/test_table.txt
          ccdb vers /test/smoke_dir/data_table

      - name: ccdb rm (empty table, then directory)
        run: |
          ccdb mktbl /test/smoke_dir/empty_table -r 1 x
          ccdb rm --force /test/smoke_dir/empty_table

      - name: ccdb mkvar + rm variation
        run: |
          ccdb mkvar smoke_variation
          ccdb rm --force -v smoke_variation

      # Every step above already fails the job if a command exits nonzero
      # (each `run:` uses bash -e). This step pins the rest of the exit code
      # contract: successful commands exit 0, real errors exit nonzero.
      - name: Exit code contract
        run: |
          # remaining commands that print successfully must also exit 0
          ccdb pwd
          ccdb cd test
          ccdb run 100
          ccdb var test
          ccdb user
          ccdb log
          ccdb howto
          ccdb horse
          # genuine errors must exit nonzero
          failures=0
          for bad in "nosuchcommand" "cat /no/such/table" "info /no/such/table" "rm --force /no/such/table"; do
            if ccdb $bad > /dev/null 2>&1; then
              echo "ERROR: 'ccdb $bad' should have exited nonzero"
              failures=$((failures+1))
            fi
          done
          test $failures -eq 0

      # Exit codes of the schema 6 db commands: 0 on success,
      # 1 on a refusal or a mismatch. A command that must act only with its --<verb>-i-am-sure flag
      # changes nothing without it and exits 1; the steps that expect 1 check the code exactly.

      - name: ccdb vers -l (sharing column)
        run: |
          ccdb vers -l /test/test_vars/test_table
          ccdb vers -l /test/test_vars/test_table | grep "(shared)" > /dev/null

      - name: ccdb db stats
        run: |
          ccdb db stats
          ccdb db stats | grep "Num shared constant sets" > /dev/null

      - name: ccdb db readiness (text and JSON)
        run: |
          ccdb db readiness
          ccdb db readiness | grep "columns with units" > /dev/null
          ccdb db readiness --stale-years 2 --json | python -c "import json, sys; p = json.load(sys.stdin); assert p['config']['stale_years'] == 2, p['config']"

      - name: ccdb provenance (a true record passes; another hash exits 1)
        run: |
          echo '[{"request": "/test/test_vars/test_table:100:default", "path": "/test/test_vars/test_table", "run": 100, "variation": "default", "time": "", "tag": "", "assignment_id": 4, "sha256": "55d35b501c1a5775b00fe77c00e7195ebe4d0b1b513ec0948d60df9cba239346"}]' > record.json
          ccdb provenance record.json
          sed 's/"sha256": "55/"sha256": "00/' record.json > changed.json
          set +e
          ccdb provenance changed.json
          code=$?
          set -e
          test "$code" -eq 1

      - name: ccdb db readiness refuses a negative window (exit 1)
        run: |
          set +e
          ccdb db readiness --stale-years -1
          code=$?
          set -e
          test "$code" -eq 1

      - name: ccdb db upgrade refuses a schema 6 database (exit 1)
        run: |
          set +e
          output=$(ccdb db upgrade --upgrade-i-am-sure 2>&1)
          code=$?
          set -e
          echo "$output"
          test $code -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }
          if echo "$output" | grep -q "Traceback"; then echo "CLI leaked a python traceback"; exit 1; fi

      # The frozen copy of CCDB 2.4's schema 5 that the upgrade tests start from. Its seed has no equal
      # sets; a second copy of one set, with its assignment moved onto the copy, gives dedup a merge.
      - name: Create a schema 5 database
        run: |
          python - "sqlite:///$V5_FILE" <<'EOF'
          import sys
          sys.path[:0] = ["python/tests", "scripts/schema"]
          from sqlalchemy import text
          from compare import engine_for
          from schema_v5_base import create_v5_sqlite
          engine = engine_for(sys.argv[1])
          create_v5_sqlite(engine)
          with engine.begin() as connection:
              connection.execute(text("INSERT INTO constantSets (vault, constantTypeId) SELECT vault, constantTypeId "
                                      "FROM constantSets WHERE id = (SELECT constantSetId FROM assignments WHERE id = 4)"))
              connection.execute(text("UPDATE assignments SET constantSetId = (SELECT MAX(id) FROM constantSets) WHERE id = 4"))
          EOF
          ccdb -c "sqlite:///$V5_FILE" db | grep "Schema version: 5" > /dev/null

      - name: ccdb db upgrade --dry-run
        run: |
          ccdb -c "sqlite:///$V5_FILE" db upgrade --dry-run --sqlite-time-zone America/New_York
          ccdb -c "sqlite:///$V5_FILE" db | grep "Schema version: 5" > /dev/null

      - name: ccdb db upgrade without its flag changes nothing (exit 1)
        run: |
          set +e
          output=$(ccdb -c "sqlite:///$V5_FILE" db upgrade 2>&1)
          code=$?
          set -e
          echo "$output"
          test $code -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }
          echo "$output" | grep -- "--upgrade-i-am-sure" > /dev/null
          ccdb -c "sqlite:///$V5_FILE" db | grep "Schema version: 5" > /dev/null

      - name: ccdb db upgrade --upgrade-i-am-sure
        run: |
          ccdb -c "sqlite:///$V5_FILE" db upgrade --upgrade-i-am-sure --sqlite-time-zone America/New_York
          ccdb -c "sqlite:///$V5_FILE" db | grep "Schema version: 6" > /dev/null
          test -f "$V5_FILE.v5"

      - name: ccdb db dedup (report only)
        run: |
          ccdb -c "sqlite:///$V5_FILE" db dedup
          ccdb -c "sqlite:///$V5_FILE" db dedup | grep "1 assignments would move" > /dev/null

      # The second run finds nothing left to merge
      - name: ccdb db dedup --dedup-i-am-sure
        run: |
          output=$(ccdb -c "sqlite:///$V5_FILE" db dedup --dedup-i-am-sure)
          echo "$output"
          echo "$output" | grep "merged 1 constant sets into 1" > /dev/null
          # Captured, not piped: without pipefail a pipe would check only grep's exit code
          output=$(ccdb -c "sqlite:///$V5_FILE" db dedup --dedup-i-am-sure)
          echo "$output"
          echo "$output" | grep "merged 0 constant sets" > /dev/null

      - name: ccdb db rehash
        run: ccdb -c "sqlite:///$V5_FILE" db rehash

      # A stored hash that no longer matches its data, as a vault changed by SQL would leave it
      - name: ccdb db rehash finds a mismatch (exit 1) and --rehash-i-am-sure repairs it
        run: |
          python -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); c.execute('UPDATE constantSets SET sha256 = ? WHERE id = 1', ('0' * 64,)); c.commit()" "$V5_FILE"
          set +e
          ccdb -c "sqlite:///$V5_FILE" db rehash
          code=$?
          set -e
          test $code -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }
          ccdb -c "sqlite:///$V5_FILE" db rehash --rehash-i-am-sure
          ccdb -c "sqlite:///$V5_FILE" db rehash

      - name: ccdb db rollback-v6 without its flag changes nothing (exit 1)
        run: |
          set +e
          output=$(ccdb -c "sqlite:///$V5_FILE" db rollback-v6 2>&1)
          code=$?
          set -e
          echo "$output"
          test $code -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }
          echo "$output" | grep -- "--rollback-i-am-sure" > /dev/null
          ccdb -c "sqlite:///$V5_FILE" db | grep "Schema version: 6" > /dev/null

      - name: ccdb db rollback-v6 --rollback-i-am-sure
        run: |
          ccdb -c "sqlite:///$V5_FILE" db rollback-v6 --rollback-i-am-sure --sqlite-time-zone America/New_York
          ccdb -c "sqlite:///$V5_FILE" db | grep "Schema version: 5" > /dev/null

      # The CCDB 2.5 commands, back on the schema 6 database of the steps before the upgrade ones.
      # Outputs are captured, not piped, where a check must see a line missing.

      - name: ccdb deprecate
        run: ccdb deprecate /test/test_vars/test_table -c "smoke"

      - name: ccdb ls hides a deprecated table
        run: |
          output=$(ccdb ls /test/test_vars)
          echo "$output"
          # 'test_table' or '/test/test_vars/test_table' at a line start, not test_table2
          if echo "$output" | grep -E "(^|/)test_table( |$)" > /dev/null; then echo "ls shows a deprecated table"; exit 1; fi

      - name: ccdb ls -a shows a deprecated table marked
        run: |
          output=$(ccdb ls -a /test/test_vars)
          echo "$output"
          echo "$output" | grep "test_table (deprecated)" > /dev/null

      - name: ccdb info shows the deprecation
        run: |
          output=$(ccdb info /test/test_vars/test_table)
          echo "$output"
          echo "$output" | grep "Deprecated" | grep "smoke" > /dev/null

      - name: ccdb deprecate --undo
        run: |
          ccdb deprecate --undo /test/test_vars/test_table
          output=$(ccdb ls /test/test_vars)
          echo "$output"
          echo "$output" | grep -x "test_table" > /dev/null
          output=$(ccdb info /test/test_vars/test_table)
          if echo "$output" | grep "Deprecated" > /dev/null; then echo "info still shows the deprecation"; exit 1; fi

      - name: ccdb tag (create, list, show)
        run: |
          ccdb tag smoke_tag -c "smoke"
          output=$(ccdb tag)
          echo "$output"
          echo "$output" | grep "smoke_tag" > /dev/null
          output=$(ccdb tag smoke_tag)
          echo "$output"
          echo "$output" | grep "smoke" > /dev/null

      # The tag holds the default variation as it is now: run 0 is constant set 4 (values 2.2 ... 2.7)
      - name: ccdb cat with a tag
        run: |
          output=$(ccdb cat /test/test_vars/test_table:0@smoke_tag)
          echo "$output"
          echo "$output" | grep "2.2" > /dev/null

      - name: ccdb cat with a tag and a variation fails (exit non-zero)
        run: |
          set +e
          output=$(ccdb cat /test/test_vars/test_table:0:default@smoke_tag 2>&1)
          code=$?
          set -e
          echo "$output"
          test $code -ne 0 || { echo "expected non-zero exit code"; exit 1; }
          if echo "$output" | grep "Traceback" > /dev/null; then echo "CLI leaked a python traceback"; exit 1; fi

      - name: ccdb tag rm
        run: |
          ccdb tag rm smoke_tag
          output=$(ccdb tag)
          echo "$output"
          if echo "$output" | grep "smoke_tag" > /dev/null; then echo "tag rm left the tag"; exit 1; fi

      - name: ccdb prop (instance)
        run: |
          ccdb prop set --instance experiment SMOKE
          output=$(ccdb prop get --instance experiment)
          echo "$output"
          test "$output" = "SMOKE" || { echo "expected SMOKE, got '$output'"; exit 1; }
          output=$(ccdb prop ls --instance)
          echo "$output"
          echo "$output" | grep -x "experiment = SMOKE" > /dev/null

      - name: ccdb mktbl with units + info
        run: |
          ccdb mktbl /test/smoke_dir/units_table -r 1 gain=double:MeV
          output=$(ccdb info /test/smoke_dir/units_table)
          echo "$output"
          echo "$output" | grep "gain \[MeV\]" > /dev/null
