name: Spack recipe

on:
  push:
  pull_request:
    branches: [v2-main]

jobs:
  # spack/check_recipe.sh installs the C++ library from this checkout with spack/spack_repo/ccdb, builds
  # cpp/examples/consumer against the installed package and reads a table through it
  spack-install:
    name: spack install ccdb (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: spack/ubuntu-noble:1.2.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default variants
            variants: ""
          - name: ~mysql
            variants: "~mysql"

    steps:
      - uses: actions/checkout@v7

      - name: Install with the recipe and build the consumer against it
        run: bash spack/check_recipe.sh "${{ matrix.variants }}"
