name: Documentation

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - v2-main

jobs:
  deploy:
    # if: github.ref == 'refs/heads/v2-main'
    permissions:
      id-token: write
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Introspect
        run: |
          echo "--- pwd"
          pwd
          echo "--- ls ./docs/"
          ls ./docs/

      - name: Check links and anchors
        run: |
          python3 -m unittest discover -s scripts/docs -p 'test_*.py'
          python3 scripts/docs/check_links.py docs

      # docs/deployment/scaling.md: its tables and charts are the published load test results (scripts/loadtest/results)
      - name: Scaling page equals the load test results
        run: python3 scripts/loadtest/report.py --check

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the docsify site
          path: "./docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
