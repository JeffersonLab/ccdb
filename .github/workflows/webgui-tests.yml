name: Web GUI checks

# The web GUI gate from scripts/webgui/: the deterministic fixture database, the smoke suite
# (status per URL, no server errors), the golden comparison (page contents against SQL on the
# fixture) and the vendored-asset manifest. Unit tests run in the Python tests workflow.

on:
  push:
  pull_request:
    branches: [v2-main]

jobs:
  webgui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CCDB_SPACE: ${{ github.workspace }}/space-ci

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ccdb with the web extra
        run: pip install ".[web]"

      - name: Vendored browser libraries match their sha256 manifest
        run: python -m ccdb.webgui.vendor

      # Built on every run, never checked in: the hash depends on the SQLite library version,
      # so determinism is checked by building twice (--verify), not against a stored hash.
      - name: Build the fixture database
        run: python scripts/webgui/make_fixture.py --verify

      - name: Smoke suite
        run: python scripts/webgui/smoke.py --label ci --check

      - name: Golden comparison
        run: |
          python scripts/webgui/golden.py compute
          python scripts/webgui/golden.py compare --label ci

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgui-reports
          path: space-ci/reports/

  # The RPM stack of a RHEL 9 deployment: AlmaLinux 9 (python 3.9) with Flask 2.2 and Werkzeug 2.2, whose
  # URL encoding differs from the newer releases the Python tests workflow gets (Werkzeug 2.2 percent-encodes
  # "/" and ":" in a query string). Keeps that stack under test; the pages are the same, so the tests
  # compare decoded URLs.
  webgui-unit-tests-rhel9:
    name: webgui-unit-tests-rhel9 (AlmaLinux 9, Flask 2.2, Werkzeug 2.2)
    runs-on: ubuntu-latest
    container: almalinux:9
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up the system Python in a virtual environment
        run: |
          dnf -y install python3
          python3 -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"

      # The api extra (FastAPI) is needed by unit_test_card_feed, the dev extra (PyYAML, httpx, jsonschema) by the test helpers
      - name: Install ccdb with Flask 2.2 and Werkzeug 2.2
        run: pip install ".[web,api,dev]" "flask==2.2.*" "werkzeug==2.2.*"

      - name: Show the versions
        run: python -c "import sys, flask, importlib.metadata as m; print(sys.version); print('flask', m.version('flask'), 'werkzeug', m.version('werkzeug'))"

      - name: Run the web GUI unit tests
        working-directory: python
        run: >
          python -m unittest
          tests.unit_test_webgui
          tests.unit_test_webgui_assignments
          tests.unit_test_webgui_compare
          tests.unit_test_webgui_diff
          tests.unit_test_webgui_escaping
          tests.unit_test_webgui_fragments
          tests.unit_test_webgui_prefix
          tests.unit_test_webgui_queries
          tests.unit_test_card_feed
