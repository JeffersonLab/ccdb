{% extends 'base.html' %}
{% block title %}Logs · CCDB{% endblock %}

{% block page_header %}
<h1 class="h3 mb-3">Logs</h1>
{% endblock %}

{% block content %}
<form class="toolbar mb-3" method="get" data-live-table="#table-fragment" role="search">
  <input class="form-control" style="max-width: 18rem" type="search" name="search" value="{{ query.search }}" placeholder="Search description or author" aria-label="Search">
  <select class="form-select" style="max-width: 8rem" name="per_page" aria-label="Rows per page">
    {% for size in page_sizes %}<option value="{{ size }}" {{ 'selected' if size == query.per_page }}>{{ size }} rows</option>{% endfor %}
  </select>
  <input type="hidden" name="sort" value="{{ query.sort }}">
  <input type="hidden" name="order" value="{{ query.order }}">
  <button class="btn btn-outline-secondary" type="submit">Apply</button>
</form>
{% include '_logs_table.html' %}
{% endblock %}

{% block page_scripts %}<script type="module" src="{{ url_for('static', filename='js/table.js') }}"></script>{% endblock %}
