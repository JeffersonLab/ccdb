{% extends 'base.html' %}
{% block title %}{{ status }} {{ title }} · CCDB{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 40rem">
  <div class="alert alert-{{ 'warning' if status == 404 else 'danger' }}" role="alert">
    <h1 class="h4 alert-heading">{{ status }} {{ title }}</h1>
    <p class="mb-0">{{ message }}</p>
  </div>
  <a class="btn btn-primary" href="{{ url_for('directory_tree') }}"><svg class="ico me-1"><use href="#i-table"/></svg>Browse the tables</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('test_request') }}">Make a request</a>
</div>
{% endblock %}
