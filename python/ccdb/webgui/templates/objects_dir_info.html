<div class="modal-header">
  <h5 class="modal-title"><svg class="ico me-1"><use href="#i-folder"/></svg>{{ directory.name }}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <table class="table table-sm mb-0">
      <tbody>
        <tr>
          <th scope="row">DB ID</th>
          <td>{{ directory.id }}</td>
        </tr>
        <tr>
          <th scope="row">Full path</th>
          <td>{{ directory.path }}</td>
        </tr>
        <tr>
          <th scope="row">Created</th>
          <td>{{ directory.created.strftime('%Y-%m-%d %H:%M:%S') }}</td>
        </tr>
        <tr>
          <th scope="row">Modified</th>
          <td>{{ directory.modified.strftime('%Y-%m-%d %H:%M:%S') }}</td>
        </tr>
        <tr>
          <th scope="row">Author</th>
          <td>{{ author_name }}</td>
        </tr>
        <tr>
          <th scope="row">Comment</th>
          <td>{{ directory.comment }}</td>
        </tr>
      </tbody>
    </table>
  </div>
