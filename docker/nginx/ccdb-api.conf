# nginx in front of the CCDB HTTP API: the cache is part of the deployment (docs/apis/http.md).
#
# The API marks what may be cached and for how long: an assignment named by id, a request with a past time or a tag,
# and a run bundle for a year (immutable); lists and redirects for a minute; the health check never. nginx keeps
# those answers and serves repeated requests without the API, and proxy_cache_lock makes one request fetch a missing
# entry while the others wait for it, so a thousand jobs that start together reach the API once per URL.
#
# Put this file into /etc/nginx/conf.d/ and set the upstream to the API containers.

proxy_cache_path /var/cache/nginx/ccdb levels=1:2 keys_zone=ccdb:50m max_size=20g inactive=30d use_temp_path=off;

upstream ccdb_api {
    server ccdb-api:8000;
    keepalive 32;
}

server {
    listen 8080;

    location /api/v1/ {
        proxy_pass http://ccdb_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache ccdb;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_lock on;                    # one request fills a missing entry, the others wait for it
        proxy_cache_lock_timeout 300s;          # a run bundle may take a while to build on its first request
        proxy_cache_lock_age 300s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;              # If-None-Match with the ETag the API sends
        proxy_cache_valid 302 1m;               # the API's Cache-Control decides; this covers answers without one
        proxy_read_timeout 300s;
        # The raw data form carries the table's columns in X-CCDB-Schema: about 10 KB for a table of 200 columns, more
        # with column comments. nginx's default header buffer (one page, 4 or 8 KB) answers such a table with 502
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /api/v1/health {
        proxy_pass http://ccdb_api;
        proxy_cache off;
    }
}
