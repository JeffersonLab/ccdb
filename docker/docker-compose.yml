version: '3.8'

services:
  mysqldb:
    build:
      context: .. # Use the parent directory as the context
      dockerfile: docker/mysqldb/Dockerfile
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      # Set the MySQL database name so the ccdb.mysql.sql can proceed
      MYSQL_DATABASE: test_ccdb
    ports:
      - "3306:3306" # Expose MySQL to the host
    networks:
      - app_network
    volumes:
      # Adjust the path for sql directory relative to docker-compose.yml
      - mysql_data:/var/lib/mysql
      - mysql_init_data:/docker-entrypoint-initdb.d

  webgui:
    build:
      context: .. # the repository root: the image builds the ccdb wheel from python/
      dockerfile: docker/webgui/Dockerfile
    container_name: webgui
    environment:
      # dialect://username:password@host:port/database — the same variable the ccdb CLI reads
      CCDB_CONNECTION: mysql://test_user:test_password@mysqldb:3306/test_ccdb
      CCDB_WEBGUI_WORKERS: 4
      # set to 1 behind a reverse proxy that forwards under a sub-path (X-Forwarded-Prefix)
      CCDB_WEBGUI_PROXY_FIX: 0
    depends_on:
      - mysqldb
    ports:
      - "5000:5000" # Expose web GUI
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  mysql_init_data:
  mysql_data:
